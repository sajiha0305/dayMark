services:
  - type: web
    name: daymark-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/auth/csrf
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

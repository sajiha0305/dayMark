spring.application.name=daymark-api
spring.profiles.default=local
server.port=${PORT:8081}
server.servlet.session.cookie.name=DAYMARK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/daymark}
spring.datasource.username=${DATABASE_USERNAME:daymark}
spring.datasource.password=${DATABASE_PASSWORD:daymark_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
